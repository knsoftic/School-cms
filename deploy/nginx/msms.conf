# ─────────────────────────────────────────────────────────────────────────────
#  Multi-School Management System — nginx site
#  SRS §27 "Production Deployment": Nginx, SSL, Domain. FR-DEPLOY-001.
#
#  This file configures ONE thing: the public HTTPS origin in front of the
#  Express API (`npm start` -> src/server.js). It is not the frontend's config,
#  it is not a static file server, and it introduces no technology outside
#  §27's list. The only external tool it accommodates is certbot: one location
#  block serves the ACME HTTP-01 webroot so the §27 certificate can be issued
#  and renewed. Nothing here schedules, hooks or scripts that renewal — the
#  location block and a `/var/www/certbot` path are the whole of it. A
#  deployment that obtains its certificate by DNS-01 or by hand can delete that
#  location and the webroot; nothing else in this file depends on it.
#
#  Include it from a directory that is already inside nginx's `http { }` block
#  (conf.d/ or sites-enabled/). The two `map` blocks, the `log_format` and the
#  `upstream` at the top are http-context directives and will not parse
#  anywhere else.
#
#  ## The application-side facts this file has to agree with
#  Every one of these was read out of the code, not assumed. Line numbers were
#  re-checked against the working tree; if one does not resolve, treat the
#  claim beside it as unverified until you have re-read the source:
#
#    binds :4000 on ALL interfaces     server.js:99, config/env.js:105
#                                      (see the upstream block — this is a live
#                                       hazard, not a hypothetical one)
#    everything under /api/v1          config/env.js:106, app.js:289
#    trust proxy, default false        config/env.js:110, app.js:245
#    JSON/urlencoded body cap 100kb    config/env.js:118, app.js:270-271
#    absolute upload ceiling 10 MB     config/env.js:192, .env.example:70
#    compression() runs in-process     app.js:267
#    helmet sets HSTS itself           app.js:256 + helmet 8 defaults
#    no express.static, ever           utils/fileResponse.js:1-10
#    one process, fork mode            deploy/pm2/ecosystem.config.js:219-220
#    refresh + CSRF cookies SameSite=Lax
#                                      auth.controller.js:66, :77, csrf.js:58
#
#  If any of those change, this file is wrong until it is changed too.
#
#  ## READ FIRST — bootstrap order, because the obvious order deadlocks
#
#  The :443 block below names two files under /etc/letsencrypt/live/. If those
#  files are absent, nginx does not start *at all*: `nginx -t` fails with
#  `[emerg] cannot load certificate ... No such file or directory`, and the
#  master refuses to come up, taking every other vhost in sites-enabled with
#  it. So "install this file, then let certbot use the ACME location on :80 to
#  get the first certificate" cannot work — nginx is not running to serve the
#  challenge. Install in this order:
#
#    1. Point the §27 Domain's A/AAAA record at this host.
#    2. Obtain the certificate with nginx STOPPED:
#         certbot certonly --standalone -d api.msms.example.com
#       (or with a temporary HTTP-only vhost, or by DNS-01 — any route that
#       does not require this file to be live).
#    3. Create the ACME webroot:  install -d -o root -g root /var/www/certbot
#    4. Substitute every PLACEHOLDER below (`grep -n PLACEHOLDER` on this file
#       lists them), install it, and `nginx -t`.
#    5. Reload nginx. From here on renewals are served by the :80 ACME
#       location and no downtime is needed.
#
#  Nothing in this file has been executed. It was written against the
#  application source; nginx is not installed on the machine it was authored
#  on, so it has NOT been checked with `nginx -t`, and no directive here has
#  ever been parsed. Run `nginx -t` on the target host before reloading, and
#  expect the placeholders to be what fails first.
#
#  The full assumptions and limitations list is at the BOTTOM of this file.
#  Read it before trusting any behaviour described in a comment.
# ─────────────────────────────────────────────────────────────────────────────


# ── map: request id ──────────────────────────────────────────────────────────
#
# nginx mints an id for every request it handles, including the ones the
# application never sees, and the app adopts it.
#
# `requestContext` accepts an inbound X-Request-Id when it matches
# /^[A-Za-z0-9._~-]{8,64}$/ and otherwise mints its own (requestContext.js:20,
# :23-24). nginx's `$request_id` is 32 lowercase hex characters, which matches
# that pattern — so passing it upstream means `req.id` IS `$rid`, and the id on
# the nginx access line is the id in the app's error envelope.
#
# The regex below is a transcription of SAFE_REQUEST_ID. Keeping the two in
# step is what makes the guarantee hold: an id nginx forwards but the app
# rejects would silently split the trail in two. It also does a second job —
# it bounds `$rid` to a character set with no quote and no backslash in it,
# which is what makes it safe to interpolate into the JSON error bodies below.
# Widen this class and those `return` statements become a JSON injection.
map $http_x_request_id $rid {
    "~^[A-Za-z0-9._~-]{8,64}$"  $http_x_request_id;
    default                     $request_id;
}


# ── map: CORS origin for nginx's OWN error responses ─────────────────────────
#
# PLACEHOLDER — substitute the frontend origin, and keep it in step with
# CORS_ORIGINS in backend/.env (config/env.js:109). Two entries if the
# frontend has two origins; one line each.
#
# Why this exists: `cors()` runs in-process at app.js:266, so every response
# the *application* produces — including its own 413 (errorHandler.js:177) and
# its 404 (errorHandler.js:210) — already carries Access-Control-Allow-Origin.
# Responses nginx generates itself carry none, because the app never ran. To a
# browser that is not "a 502 with a JSON body", it is an opaque network error:
# `fetch` rejects before the frontend can read the envelope, and the carefully
# shaped JSON below is unreadable by the only client it was written for.
#
# An origin that is not listed here yields an empty value, and nginx omits a
# header whose value is empty — so an unlisted origin gets no CORS header,
# which is the safe direction and is exactly today's behaviour.
#
# These headers are added ONLY inside the named error locations and the 404
# below, never at server level. At server level they would also be appended to
# every *proxied* response, which already carries the app's own
# Access-Control-Allow-Origin — and a response with two of that header is
# rejected outright by every browser ("contains multiple values"). That would
# break the entire frontend, not just its error handling. Same class of trap
# as the HSTS note further down: `add_header` appends, it never replaces.
map $http_origin $cors_allow {
    default                             "";
    "https://app.msms.example.com"      $http_origin;
}


# ── Access log format ────────────────────────────────────────────────────────
#
# The default `combined` format cannot be joined to anything the application
# wrote. `rid=` fixes that, but be precise about what it joins to, because the
# obvious stronger claim is false:
#
#   IT DOES JOIN an nginx access line to
#     - the app's error and warn lines (errorHandler.js:227, :235, which log
#       `requestId: req.id` explicitly), and
#     - the id a user quotes out of a failure envelope (errorHandler.js:270).
#
#   IT DOES NOT JOIN to the app's own access line. morgan's format string is
#   ':method :url :status :res[content-length] - :response-time ms'
#   (app.js:216) — no request-id token — and it is piped into winston as a bare
#   string (app.js:218), while winston's `defaultMeta` is only
#   { service, env } (logger.js:54). So the per-request record in
#   backend/storage/logs/combined-*.log carries no id at all. Closing that gap
#   is an app change this file cannot make: add `:res[x-request-id]` to the
#   morgan format at app.js:216. It resolves there because `requestContext`
#   runs at app.js:251 and `requestLogging()` at app.js:252, so the header
#   (requestContext.js:27) is already set by the time morgan reads it.
#
# `rid=$rid` and not `rid=$sent_http_x_request_id`: the sent-header form is
# blank on exactly the lines the field was added for. A 502, a 504, a 413 or a
# 404 from nginx has no X-Request-Id on the response because the app never ran
# to set one. `$rid` comes from the map above and is always present.
#
# `$request_time` is included because it is the only timing nginx has that the
# app does not: morgan's `:response-time` (app.js:216) starts after Express has
# the request, so a slow body upload or a slow client shows up here and nowhere
# else. Note the caveat that follows from the paragraph above: comparing the
# two numbers means finding the app's access line by hand until
# `:res[x-request-id]` is added there.
log_format msms '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rid=$rid rt=$request_time urt=$upstream_response_time';


# ── The upstream ─────────────────────────────────────────────────────────────
upstream msms_api {
    # ONE entry, because there is one process. deploy/pm2/ecosystem.config.js
    # pins `instances: 1, exec_mode: 'fork'` (:219-220) and says why: the
    # rate-limit store is `express-rate-limit`'s in-memory one, so counters are
    # per process — "behind N workers the effective ceiling is N × the
    # configured limit" (rateLimit.js:29-32, which names SRS §3 as describing a
    # single-process deployment) — and the entitlement cache is per process for
    # the same reason. Running more than one instance is a correctness change,
    # not a capacity change.
    #
    # If that ever changes, it changes here too: PM2 fork mode with N instances
    # needs N distinct PORT values and N `server` lines in this block. PM2
    # *cluster* mode would keep one port and need no change here — but the two
    # reasons above are why it is not used.
    #
    # ── The bind address is a LIVE hazard, not a hypothetical one ────────────
    #
    # This line says 127.0.0.1 because that is the only address nginx should
    # need. The application does NOT bind loopback. `server.js:99` is
    # `app.listen(config.app.port, () => {` with no host argument, so Node
    # binds 0.0.0.0 and ::, and there is no setting that changes it: the only
    # network key `env.js` reads for the HTTP server is `port: num('PORT',
    # 4000)` (env.js:105), and `.env.example` contains no HOST or BIND_ADDRESS
    # in its 73 keys.
    #
    # So port 4000 is reachable from wherever this host's network allows, and
    # everything below — TLS, the body cap, the forwarded headers, the error
    # envelopes — can be walked around by talking to it directly. Two fixes,
    # and the deployment needs at least the first:
    #
    #   1. Close 4000 at the host firewall so only loopback reaches it. This is
    #      an operator step on the OS, not a technology this file introduces.
    #   2. Durable fix, an app change this file cannot make: pass the host —
    #      `app.listen(config.app.port, '127.0.0.1', ...)` at server.js:99.
    #
    # Until one of those is done, treat this whole file as advisory rather than
    # enforcing: it is a front door on a building with an open side entrance.
    server 127.0.0.1:4000 max_fails=0;

    # Keep-alive to the upstream, so a burst of requests does not pay a TCP
    # handshake each. `keepalive_timeout` here MUST stay below Node's own idle
    # timeout or this optimisation becomes a source of sporadic 502s: Node's
    # `server.keepAliveTimeout` defaults to 5000 ms and `src/server.js` never
    # changes it (verified — the file sets no keepAliveTimeout/headersTimeout),
    # so at exactly 5 s Node closes an idle socket. If nginx still believes that
    # socket is usable it will write a request into a connection being torn
    # down, and the client gets a 502 for a request the app never saw. 4 s
    # gives a full second of margin.
    #
    # `keepalive_timeout` and `keepalive_requests` in an upstream block require
    # nginx >= 1.15.3. On anything older, delete those two lines and keep
    # `keepalive` — or delete all three and accept the handshakes.
    keepalive 16;
    keepalive_timeout 4s;
    keepalive_requests 1000;
}


# ── :80 — ACME, then redirect ────────────────────────────────────────────────
server {
    listen 80;
    # IPv6. DELETE this line on an IPv4-only host, or nginx aborts at bind with
    # `socket() [::]:80 failed (97: Address family not supported by protocol)`
    # and does not start. Nothing in the repository records the target host's
    # networking, so this is an assumption — see the list at the bottom.
    listen [::]:80;

    server_name api.msms.example.com;   # PLACEHOLDER — substitute the real §27 Domain.

    access_log /var/log/nginx/msms.access.log msms;
    error_log  /var/log/nginx/msms.error.log warn;

    # nginx announces its version on every error page and in `Server:`. The app
    # already refuses to do the equivalent (`app.disable('x-powered-by')`,
    # app.js:248); this is the same decision one layer out.
    server_tokens off;

    # The ACME HTTP-01 challenge must be answerable over plain HTTP, and it must
    # be matched BEFORE the redirect below. `^~` stops nginx looking further, so
    # this cannot be shadowed by a later rule.
    #
    # This location serves RENEWALS. It cannot serve the first issuance, and an
    # earlier draft of this comment claimed the opposite — see the bootstrap
    # order in the header: on a fresh host the :443 block's missing certificate
    # stops nginx from starting, so nothing is listening on :80 either. The
    # first certificate has to be obtained with nginx stopped (or from a
    # temporary HTTP-only vhost, or by DNS-01) BEFORE this file is installed.
    #
    # Deleting this location does not break anything today. It breaks the
    # *renewal*, silently, sixty days later, and the first symptom is an expired
    # certificate. Point `root` at whatever webroot certbot is told to use; the
    # directory must exist and be readable by nginx.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else goes to TLS. 301 and not 308, deliberately.
    #
    # A 308 preserves the method and body, so a POST sent to :80 would be
    # replayed over TLS and "just work". That is the wrong outcome here: the
    # body of that POST — a password on /api/v1/auth/login, a payment record —
    # has *already* crossed the network in cleartext, and quietly succeeding
    # hides a credential exposure that needs a rotation. A 301 is downgraded to
    # GET by most clients, the request 404s, and the failure is visible.
    #
    # For browsers this path is normally traversed exactly once: helmet's HSTS
    # header (see the :443 block) pins the origin to https for a year after the
    # first successful response.
    location / {
        return 301 https://$host$request_uri;
    }
}


# ── :443 — the API origin ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    # IPv6 — same caveat as on :80. Delete on an IPv4-only host.
    listen [::]:443 ssl;
    http2 on;                    # nginx >= 1.25.1. On older builds delete this
                                 # line and write `listen 443 ssl http2;` above.

    # PLACEHOLDER. §27 says "Domain" and names none, and nothing in the code
    # carries the production hostname — APP_URL/CORS_ORIGINS in .env.example
    # hold localhost development values (lines 11 and 14). Substitute the real
    # host, and set CORS_ORIGINS to the *frontend's* origin (config/env.js:109):
    # the two are different origins by design, which is the whole reason the
    # app runs a CORS allow-list at all (app.js:178-199).
    #
    # CONSTRAINT ON WHICH HOSTNAME YOU MAY CHOOSE — this is not free.
    #
    # The host substituted here MUST share a registrable domain (eTLD+1) with
    # every origin in CORS_ORIGINS. Both cookies the session depends on are
    # `sameSite: 'lax'` with no `domain` attribute: the refresh cookie
    # (auth.controller.js:66, and :77 when clearing it) and the CSRF cookie
    # (csrf.js:58). SameSite is evaluated against the registrable domain, so
    #
    #     app.msms.example.com  ->  api.msms.example.com     works
    #     app.example.net       ->  api.msms.example.com     does not
    #
    # and the failure mode of the second is the bad one: CORS is configured
    # correctly, the preflight passes, the login succeeds — and then the
    # browser simply never sends the refresh cookie, so every session dies at
    # the first token expiry with no error logged anywhere. Nothing in nginx
    # can fix that. A genuinely cross-site frontend needs the app changed to
    # `sameSite: 'none'` (with `secure`), which is an app change and carries
    # its own CSRF consequences — auth.controller.js:21-24 justifies `lax` from
    # the *development* localhost:3000 -> localhost:4000 pairing only.
    server_name api.msms.example.com;

    access_log /var/log/nginx/msms.access.log msms;
    error_log  /var/log/nginx/msms.error.log warn;
    server_tokens off;

    # ── Rotation of the two files above: inherited, not configured here ──────
    #
    # These two logs grow without bound on their own. Rotation is NOT set up by
    # this file and NOT set up by deploy/logrotate/msms, which deliberately
    # declines to touch them and says why: the nginx distribution package ships
    # /etc/logrotate.d/nginx, which globs /var/log/nginx/*.log and performs the
    # `kill -USR1` reopen that a bare `create` would get wrong. A second stanza
    # naming the same paths makes logrotate abort that run with "duplicate log
    # entry" and skip rotation entirely.
    #
    # Two consequences worth knowing before you move these files:
    #   - Keeping them under /var/log/nginx/ with a .log suffix is what makes
    #     rotation happen. Relocate them and rotation stops SILENTLY — no
    #     error, just a partition that fills in a few months.
    #   - Verify the inheritance on the target host rather than assuming it:
    #       grep -n 'var/log/nginx' /etc/logrotate.d/nginx
    #     If that file is absent (a source build, a minimal image), rotation for
    #     §27 "Logging" is genuinely missing and someone has to add it.

    # ── TLS ──────────────────────────────────────────────────────────────────
    #
    # certbot's usual layout. §27 requires SSL for the Domain and names no
    # issuer; Let's Encrypt is the conventional way to satisfy that. Obtaining
    # the first certificate is an operator step — see the bootstrap order in the
    # header — and nothing in this repository automates or schedules renewal.
    ssl_certificate     /etc/letsencrypt/live/api.msms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.msms.example.com/privkey.pem;

    # TLS 1.2 is the floor. Not 1.3-only: the SRS names no client population,
    # and this API is consumed by "future Android/iOS/third-party" clients
    # (utils/ApiResponse.js:4-5), some of which will be on runtimes without 1.3.
    # 1.0/1.1 are absent because they are deprecated (RFC 8996) and no client
    # this project supports needs them.
    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 1.2 suites only — TLS 1.3's are fixed and not configurable here.
    # ECDHE-only, which is what makes every session forward-secret: with a
    # static-RSA suite, one later compromise of privkey.pem decrypts every
    # session ever recorded, and this origin carries JWTs and a refresh cookie.
    # The DHE suites from Mozilla's intermediate list are deliberately left out:
    # they would require an `ssl_dhparam` file, and an operator who forgets it
    # gets nginx's weak built-in parameters rather than a startup error.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # The client knows better than we do which
                                     # of these its hardware accelerates.

    ssl_session_cache shared:MSMS_TLS:10m;
    ssl_session_timeout 1d;
    # Session *tickets* off: nginx's ticket key is generated at start-up and
    # never rotated, so a compromise of a long-running worker's memory decrypts
    # every ticketed session it ever issued — which undoes the forward secrecy
    # the ECDHE-only cipher list above was chosen for.
    ssl_session_tickets off;

    # OCSP stapling saves every client a round trip to the CA and stops the CA
    # learning who visits this origin. It needs a resolver to reach the OCSP
    # responder, and there is no correct value to hard-code — it is the
    # deployment's DNS. Uncomment all three lines together and fill in the real
    # resolver; enabling stapling without one only produces warnings in
    # error.log and no stapled response.
    #
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/api.msms.example.com/chain.pem;
    # resolver <dns-ip> valid=300s;
    # resolver_timeout 5s;

    # ── HSTS: helmet already sets it, so nginx must not ──────────────────────
    #
    # There is NO `add_header Strict-Transport-Security` in this file, and that
    # is a decision, not an oversight.
    #
    # `helmet()` is mounted at app.js:256 with only `crossOriginResourcePolicy`
    # overridden, so every other helmet default is live — including HSTS, whose
    # default in helmet 8 is `max-age=31536000; includeSubDomains` with no
    # preload (node_modules/helmet/index.cjs:238 `DEFAULT_MAX_AGE = 365*24*60*60`
    # and :254 for includeSubDomains). Every proxied response therefore already
    # carries that header.
    #
    # nginx's `add_header` *appends*; it cannot replace an upstream header. So
    # adding one here would put two Strict-Transport-Security headers on the
    # wire. RFC 6797 §8.1 says a UA processes only the first, and the upstream's
    # comes first — meaning the nginx value would be silently ignored while
    # looking, in this file, like the live policy. That is exactly the
    # "two settings, one of them dead" trap this codebase's comments exist to
    # prevent.
    #
    # The cost of leaving it to helmet: responses nginx generates *itself* — the
    # 400/408/413/502/504 below — carry no HSTS, because the app never ran. That
    # is acceptable. HSTS is a pin, not a per-response control: a browser that
    # has seen one successful API response holds the policy for a year.
    #
    # If a deployment insists nginx own the header, the only correct way is to
    # take it away from the app first, and the value must then be kept in step
    # with helmet's by hand:
    #
    #   proxy_hide_header Strict-Transport-Security;
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    # Nothing else needs adding either. helmet's defaults already emit
    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy, CSP,
    # Cross-Origin-Opener-Policy, Origin-Agent-Cluster and the rest, so any
    # `add_header` for those would duplicate a header the app controls.

    # ── Compression ──────────────────────────────────────────────────────────
    #
    # OFF, on purpose, and explicitly — because many distributions set
    # `gzip on;` at http level in nginx.conf, so omitting this line does not
    # mean "off", it means "whatever the base config decided".
    #
    # `compression()` runs in-process at app.js:267 and gzips every compressible
    # response before it leaves Node. nginx will not re-encode a response that
    # already carries Content-Encoding, so turning gzip on here would run the
    # type and length tests on every proxied response and act on almost none of
    # them — while splitting the *policy* (which types, what minimum length,
    # what level) across two config files that can drift apart.
    #
    # The real cost of this arrangement is stated rather than hidden: Node is
    # spending event-loop CPU on gzip that nginx would do more cheaply off it.
    # If that ever shows up in a profile, the fix is to delete `compression()`
    # from app.js and enable gzip here — not to enable both and hope.
    gzip off;

    # ── Request body limits ──────────────────────────────────────────────────
    #
    # THIS AND THE 100kb JSON LIMIT BOUND DIFFERENT THINGS.
    #
    #   client_max_body_size  — nginx, every request, whole encoded body,
    #                           multipart framing included. If it is too low,
    #                           nginx refuses the request itself and the app
    #                           never sees it.
    #   express.json/urlencoded `limit: '100kb'` (app.js:270-271, from
    #                           config/env.js:118) — the app, and ONLY for
    #                           bodies those two parsers handle: application/json
    #                           and application/x-www-form-urlencoded. Neither
    #                           parser touches a multipart/form-data body, so
    #                           100kb has no bearing whatsoever on an upload.
    #   multer `limits.fileSize` (upload.js:486, :524) — the app, per file,
    #                           inside a multipart body. Not a constant: it is
    #                           `req.upload.maxBytes + 1` (upload.js:287), and
    #                           maxBytes comes from the school's plan.
    #
    # ── The default: 1m, everywhere ──
    #
    # Only five routes in the whole application accept a file, and they are
    # enumerable (see the five locations below). Every other route in 36 route
    # files takes JSON or urlencoded, which express caps at 100kb. Leaving the
    # 12m upload ceiling switched on for all of them means an UNAUTHENTICATED
    # caller can make nginx buffer 12 MB to client_body_temp_path on any path
    # at all — POST /api/v1/auth/login included — before anything in the
    # application can shed it, because `apiLimiter` is mounted at app.js:283,
    # after `express.json` at :270, i.e. long after nginx has finished writing
    # the body to disk and opened the upstream request.
    #
    # 1m rather than 100kb, on purpose. Bodies between the app's JSON limit and
    # 1m still reach the app, and the app refuses them with its own 413 —
    # PAYLOAD_TOO_LARGE, carrying a request id (errorHandler.js:177, :270). That
    # is a strictly better answer than nginx's, so the app should be the one to
    # give it. nginx's job at this level is only to stop bodies so large that
    # buffering them is itself the attack.
    #
    # COUPLING: if JSON_BODY_LIMIT (.env.example:16) is ever raised above 1m,
    # raise this with it or nginx will refuse first and the app's limit will
    # look broken.
    client_max_body_size 1m;

    # Bodies larger than this spill to a temp file. Almost every request here is
    # a small JSON form well under 100kb, and 128k keeps those entirely in
    # memory; a 10 MB PDF hits disk either way and that is fine.
    client_body_buffer_size 128k;

    # Slow-loris bounds. A client that opens a connection and dribbles bytes
    # holds an nginx worker slot, and — because request buffering is on (see
    # below) — never reaches Node at all, so no application-level timeout can
    # save it. These three are nginx's own defaults, restated so they are
    # visible rather than inherited invisibly:
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # This one is NOT an nginx default and must not be filed under one: nginx's
    # documented default for `keepalive_timeout` is 75s. 65s is the value
    # Debian's and Ubuntu's packaged nginx.conf sets at http level. It is
    # written out here for the same reason `gzip off` is written out above —
    # so the effective value is a decision in this file rather than a property
    # of whichever distribution's base config this site was included from. If
    # you want nginx's stock behaviour instead, write 75s; nothing in this
    # application depends on either number.
    keepalive_timeout 65s;

    # ── nginx's own error responses, in the app's envelope ───────────────────
    #
    # Every client of this API parses one shape: `{ success, data }` or
    # `{ success: false, error: { code, message } }` (ApiResponse.js:7-8,
    # errorHandler.js:262-270). The frontend's shared `apiClient` is built on it
    # (ARCHITECTURE.md:208). An nginx HTML error page makes `response.json()`
    # throw, and the user sees a JSON parse error instead of "the API is
    # restarting".
    #
    # Each named location below repeats the same five `add_header` lines. That
    # repetition is mandatory, not sloppiness: nginx inherits `add_header` from
    # the enclosing level ONLY when the current level declares none at all, so a
    # location that sets one header loses every inherited one. And they cannot
    # be hoisted to server level — see the $cors_allow map above for why that
    # would break every proxied response in the application.
    #
    # 503 is NOT intercepted here, deliberately: `GET /api/v1/health/ready`
    # answers 503 from the application when the database is unreachable
    # (system.controller.js:51-74), and masking that would break the one
    # endpoint whose whole job is to report it.
    error_page 413 = @body_too_large;
    error_page 400 = @bad_request;
    error_page 408 = @client_timeout;
    error_page 502 = @upstream_down;
    error_page 504 = @upstream_timeout;

    # 502 and 504 are SPLIT, and they were collapsed onto one handler in an
    # earlier draft. `error_page 502 504 = @name;` takes the status from the
    # named location's own `return`, so every 504 arrived at the client as a
    # 502 saying "the API is not responding" — which is false for the two long
    # timeouts this file exists to set, and is the difference between "restart
    # the process" and "the process is fine and still working". For
    # /api/v1/ai/generate it is also the difference between a safe retry and a
    # second billed generation.

    location @body_too_large {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $rid always;
        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        # PAYLOAD_TOO_LARGE is the app's OWN code for an over-size body
        # (errorHandler.js:177), reused deliberately: a client that already
        # handles the app's 413 needs no change to handle nginx's. It is the one
        # code in this group that is not introduced by this file.
        return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request body is too large.","requestId":"$rid"}}';
    }

    location @bad_request {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $rid always;
        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        # MALFORMED_REQUEST is introduced by THIS FILE. The application cannot
        # produce it: a request line or Host header nginx could not parse never
        # reaches Express at all.
        return 400 '{"success":false,"error":{"code":"MALFORMED_REQUEST","message":"The request could not be parsed.","requestId":"$rid"}}';
    }

    location @client_timeout {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $rid always;
        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        # CLIENT_TIMEOUT is introduced by THIS FILE. It fires when
        # client_header_timeout or client_body_timeout above expires — the
        # caller stopped sending. Best-effort only: nginx may close a timed-out
        # connection without writing this body, in which case the client sees a
        # reset instead. Documented rather than promised.
        return 408 '{"success":false,"error":{"code":"CLIENT_TIMEOUT","message":"The request was not sent completely in time.","requestId":"$rid"}}';
    }

    location @upstream_down {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $rid always;
        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        # UPSTREAM_UNAVAILABLE is introduced by THIS FILE and is not in the
        # application's code catalogue, because the application cannot produce
        # the condition it describes — it is not running, or it refused the
        # connection. Do not document it as an API code.
        return 502 '{"success":false,"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The API is not responding. Please try again shortly.","requestId":"$rid"}}';
    }

    location @upstream_timeout {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $rid always;
        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        # UPSTREAM_TIMEOUT is introduced by THIS FILE, likewise. The wording is
        # deliberate and it is the honest one: nothing in this application
        # aborts work on client disconnect, so when proxy_read_timeout expires
        # the Node handler is still running and will finish. Telling the caller
        # to retry would be telling them to run it twice.
        return 504 '{"success":false,"error":{"code":"UPSTREAM_TIMEOUT","message":"The request took too long and the proxy stopped waiting. It may still be completing on the server — do not resubmit it.","requestId":"$rid"}}';
    }

    # ── Proxy headers ────────────────────────────────────────────────────────
    #
    # Set once at server level so every location below inherits the whole set.
    #
    # TRAP: `proxy_set_header` does not merge across levels — a single
    # `proxy_set_header` inside a location REPLACES all of these. That is why
    # every location further down contains only `proxy_pass`, a timeout or a
    # body-size override, and never a header.

    # $host, not $http_host: it falls back to server_name when a client sends no
    # Host header, so the app never sees an empty one. Express derives
    # `req.hostname` from this.
    proxy_set_header Host              $host;

    # X-Forwarded-Host, EMPTIED. nginx forwards inbound request headers to the
    # upstream by default, so declining to set this one does not stop a client
    # from supplying it — and with `trust proxy` set, Express prefers
    # X-Forwarded-Host over Host when deriving `req.hostname`. An empty value
    # makes nginx omit the field entirely rather than forward the caller's.
    #
    # Nothing in the application reads it today: `req.hostname`, `req.protocol`,
    # `req.secure` and `x-forwarded-host` return no matches across backend/src.
    # That is the reason to clear it now rather than later — the header would
    # sit there being forgeable until the first line of code that reads it, at
    # which point it is trusted by accident.
    proxy_set_header X-Forwarded-Host  "";

    # X-Forwarded-For, OVERWRITTEN with $remote_addr rather than appended with
    # $proxy_add_x_forwarded_for. This is the header the rate limiter's identity
    # ultimately rests on: `clientKey` falls back to `clientAddress(req)`, which
    # reads `req.ip` (rateLimit.js:84), and `req.ip` is whatever Express's
    # `trust proxy` setting says it is (app.js:245, config/env.js:69-95).
    #
    # Per §27, nginx IS the edge — no CDN or second proxy is in the stack — so
    # $remote_addr is the client by definition and any inbound X-Forwarded-For
    # is forged. Overwriting means the list handed to Express always has exactly
    # one entry, which makes the app's answer correct for TRUST_PROXY=1 *and*
    # for any larger hop count someone later sets by mistake. Appending would
    # also be correct at exactly TRUST_PROXY=1 (Express takes the rightmost
    # entry, which nginx wrote) and quietly forgeable at 2 or more.
    #
    # The app must be run with TRUST_PROXY=1 behind this proxy (.env.example:62-66).
    # Leaving it at its default of false collapses every client onto one shared
    # rate-limit quota keyed on 127.0.0.1 and writes 127.0.0.1 into every
    # `activity_logs.ip_address` row (activityLog.js:102). Setting it to `true`
    # is worse and the app says so at runtime: rateLimit.js:111 logs
    # "Express \"trust proxy\" is true, so X-Forwarded-For can be forged".
    proxy_set_header X-Forwarded-For   $remote_addr;

    # $scheme is always https in this block. Nothing in the application reads
    # `req.protocol` or `req.secure` today — the Secure flag on the refresh and
    # CSRF cookies is decided from NODE_ENV, not from the request
    # (auth.controller.js:65, :76 and csrf.js:57, all `secure: config.isProduction`).
    # It is sent anyway because Express derives `req.protocol` from it once
    # trust proxy is set, so any absolute URL the app or a dependency builds
    # comes out https rather than http. Omitting it would make that failure
    # silent and intermittent.
    proxy_set_header X-Forwarded-Proto $scheme;

    # The correlation id, from the map at the top. This is what makes `rid=` on
    # an nginx access line the same string as `error.requestId` in the app's
    # failure envelope: `requestContext` adopts a valid inbound id
    # (requestContext.js:23-24) rather than minting its own, and the map
    # guarantees the value is always present and always matches the app's
    # SAFE_REQUEST_ID pattern.
    proxy_set_header X-Request-Id      $rid;

    # HTTP/1.1 with an emptied Connection header — both are required for the
    # upstream keep-alive pool declared above to be used at all. Without them
    # nginx speaks HTTP/1.0 to the app and closes every connection.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The app's own 4xx and 5xx bodies are JSON envelopes with a code, a message
    # and the request id (errorHandler.js:262-270). `proxy_intercept_errors on`
    # would replace all of them with nginx pages and destroy that contract.
    #
    # This line is LOAD-BEARING for the error_page block above, not merely
    # tidy. `error_page` acts on statuses nginx itself produced; with
    # `proxy_intercept_errors on` it would also act on statuses the UPSTREAM
    # produced — and the app returns 400 constantly (every validation failure)
    # and 413 for a body over its JSON limit (errorHandler.js:177). Turning
    # this on would rewrite every one of those into MALFORMED_REQUEST or the
    # bare PAYLOAD_TOO_LARGE above, throwing away the field-level `details` a
    # validation error carries and the request id the app had already minted.
    # Whoever turns this on will be trying to fix something else.
    proxy_intercept_errors off;

    # Request buffering ON (the default, restated). nginx absorbs the whole body
    # before opening the upstream request, so a slow 10 MB upload occupies an
    # nginx worker and a temp file rather than a Node connection — and multer
    # sees a body arriving at local speed. Response buffering is likewise on, so
    # a slow client draining a report download does not hold the Node socket.
    proxy_request_buffering on;
    proxy_buffering on;

    # No proxy_cache anywhere in this file, and none should be added. Every
    # response here is either tenant-scoped JSON behind a JWT or a stored file
    # explicitly marked `Cache-Control: private, no-store` (fileResponse.js:200,
    # whose comment names the exact failure: a shared proxy holding one school's
    # file and handing it to the next caller, whose permission check never runs).

    # Nothing needs Location-header rewriting, so proxy_redirect is left at its
    # default: Host is preserved above, so any absolute URL the app builds
    # already names the public host, and Express emits relative Locations anyway.

    # ── Timeouts ─────────────────────────────────────────────────────────────
    #
    # Local upstream: a connection either completes immediately or the process
    # is down. 5s turns "the app is not running" into a fast 502 instead of a
    # 60-second hang.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;   # overridden for two paths below

    # ── The API ──────────────────────────────────────────────────────────────
    #
    # `proxy_pass http://msms_api;` with NO trailing URI, so the request path
    # reaches the app byte-for-byte. That is load-bearing for §28's Swagger UI
    # at /api/v1/docs: helmet's default CSP allows `script-src 'self'` only, and
    # swagger-ui-express serves its assets same-origin under that same prefix
    # (docs/routes.js). Any path rewriting here and the UI loads blank with CSP
    # violations in the console.
    #
    # Every location in this file is a PREFIX location. There is deliberately no
    # regex (`location ~`) anywhere: a regex location outranks every prefix
    # match except `^~`, so adding one that overlaps /api/v1/ai/ would silently
    # take that path's 300s timeout away. If you need to group the upload
    # prefixes below into one rule, group them as prefixes, not as a regex.
    location /api/v1/ {
        proxy_pass http://msms_api;
    }

    # ── The five upload prefixes ─────────────────────────────────────────────
    #
    # Where 12m comes from:
    #
    # The per-request ceiling is resolved from the school's `file_upload_limit`
    # plan entitlement (SRS §11.2), then clamped:
    #     maxMb = planMb === null ? hardMb : Math.min(planMb, hardMb)   upload.js:229
    # `hardMb` is `config.uploads.maxMb` = MAX_UPLOAD_MB, default 10
    # (config/env.js:192; .env.example:70, whose own comment on line 71 reads
    # "Absolute ceiling; a school's plan File Upload Limit may be lower and
    # wins"). Because of that Math.min, no plan row can raise the ceiling above
    # MAX_UPLOAD_MB — a plan can only lower it. So 10 MB is the largest file
    # this application will accept from anybody, under any plan.
    #
    # I could not derive a "largest seeded plan file_upload_limit", because
    # there is no seeded plan: backend/src/database/seeders/ contains exactly
    # 01-roles, 02-permissions, 03-role-permissions, 04-super-admin and
    # 05-addons. Plans are created at runtime by the Super Admin, and
    # `limit_value` is validated only as an integer >= 0 with no practical upper
    # bound (plans.validation.js:402-410). MAX_UPLOAD_MB is therefore the only
    # real number available, and it is also the only one that matters.
    #
    # Every upload route uses `uploadSingle`, which pins `files: 1`
    # (upload.js:486). `uploadArray` exists and the student_document profile
    # allows 10 files (constants.js:788, :830), but no route calls it today —
    # `grep -rn 'uploadSingle(\|uploadArray(' backend/src` outside
    # middlewares/ returns exactly the five lines cited below and nothing else.
    # So the largest legitimate body is one 10 MB file plus multipart boundaries
    # and a handful of text fields. 12m is that, with about 2 MB of slack.
    #
    # The slack is deliberate, and it is the direction to err in. Sizing this
    # *below* the app's ceiling would have nginx refuse a legitimate upload with
    # its own 413 — throwing away the app's carefully separated refusals:
    # 403 PLAN_LIMIT_EXCEEDED, which names the allowance and points at an
    # upgrade or an add-on, versus 413 FILE_TOO_LARGE, which means nothing the
    # school can buy will help (upload.js:23-28, :126-147). Sizing it above
    # costs bandwidth on a body the app will reject, and returns the caller the
    # answer that actually tells them what to do.
    #
    # THIS LIST IS A MAINTENANCE COUPLING AND IT WILL BITE. A new upload route
    # under a prefix not listed here inherits the server-level 1m and gets
    # nginx's 413 for any real file. It fails loudly, with the envelope above —
    # but it fails, and the cause is in this file, not in the route. When you
    # add an upload route: add its prefix here.
    #
    # If `uploadArray` is ever mounted, 12m must become
    # maxFiles * MAX_UPLOAD_MB + slack — nginx counts the whole body, not the
    # largest part in it. If MAX_UPLOAD_MB is raised, raise all five with it.
    #
    # ── NOTE THE MISSING TRAILING SLASH. It is not a typo. ──
    #
    # Two of the five upload routes are mounted on the module's BARE path:
    # homework.routes.js:78-79 is `router.post('/', ..., uploadSingle(...))` and
    # payments.routes.js:121-122 is the same, so the request URI is
    # /api/v1/homework and /api/v1/payments with nothing after them. A
    # `location /api/v1/homework/` — with the slash — does not match that URI.
    # It would fall through to `location /api/v1/` and its 1m cap, and every
    # homework attachment and every payment screenshot would 413. Written with
    # the slash first; caught by reading the routes, not by testing.
    #
    # A prefix without the trailing slash matches both /api/v1/homework and
    # /api/v1/homework/anything, which is what these need. The cost is that it
    # also matches any path merely BEGINNING with the string — a future
    # `api.use('/students-import', ...)` would inherit 12m from the students
    # rule without anyone deciding that. Before adding a module whose mount
    # extends one of these five names, look here. `grep -n "api.use('/" app.js`
    # is the list to check against.

    # POST /api/v1/assignments/:id/submissions
    #   uploadSingle(SUBMISSION, 'attachment')
    #   assignments.routes.js:156, mounted app.js:524
    location /api/v1/assignments {
        proxy_pass http://msms_api;
        client_max_body_size 12m;
    }

    # POST /api/v1/homework            <- bare path, see the note above
    #   uploadSingle(HOMEWORK, 'attachment')
    #   homework.routes.js:79, mounted app.js:523
    location /api/v1/homework {
        proxy_pass http://msms_api;
        client_max_body_size 12m;
    }

    # POST /api/v1/payments            <- bare path, see the note above
    #   uploadSingle(PAYMENT_PROOF, 'screenshot')
    #   payments.routes.js:122, mounted app.js:480
    location /api/v1/payments {
        proxy_pass http://msms_api;
        client_max_body_size 12m;
    }

    # POST /api/v1/students/:id/photo
    #   uploadSingle(PERSON_PHOTO, 'photo')
    #   students.routes.js:92, mounted app.js:515
    location /api/v1/students {
        proxy_pass http://msms_api;
        client_max_body_size 12m;
    }

    # AI — the fifth upload prefix (POST /api/v1/ai/banks,
    # uploadSingle(AI_SOURCE, 'source'), ai.routes.js:115, mounted app.js:527)
    # and also the slowest path in the
    # application by a wide margin, the one place where nginx and the app
    # genuinely cannot be made to agree.
    #
    # POST /api/v1/ai/banks/:id/{extract,analyze,generate} call the Anthropic
    # API synchronously inside the request (ai/anthropic.js:107, :129, :152).
    # The SDK client is constructed with no timeout override
    # (ai/anthropic.js:63), so its default applies: 600000 ms per attempt, with
    # 2 retries (node_modules/@anthropic-ai/sdk/index.js:67, :136 and :50) —
    # a worst case near half an hour of upstream silence.
    #
    # 300s is a judgement, not a derived number. Waiting the SDK's full budget
    # would tie up an nginx worker and a browser tab for thirty minutes; cutting
    # much shorter would 504 generations that were going to succeed. Be clear
    # about the consequence: when nginx gives up first, the Node handler keeps
    # running to completion — nothing in this application aborts work on client
    # disconnect — so the AI call finishes, and for /generate the AI_LIMIT usage
    # has already been consumed by `enforceLimit(LIMITS.AI_LIMIT)`
    # (ai.routes.js:156) against a request whose caller saw a 504. That is why
    # @upstream_timeout above says "do not resubmit" rather than "try again":
    # a retry is a second metered generation for one user request. The only real
    # fix is an explicit `timeout` on the Anthropic client in
    # src/ai/anthropic.js; this file cannot supply one.
    #
    # No trailing slash, for the same reason and with the same caveat as the
    # four above — kept uniform across all five upload prefixes so the set can
    # be read at a glance rather than checked one at a time.
    location /api/v1/ai {
        proxy_pass http://msms_api;
        proxy_read_timeout 300s;
        client_max_body_size 12m;
        # No proxy_set_header here — see the TRAP note above. Adding one would
        # discard Host, X-Forwarded-Host, X-Forwarded-For, X-Forwarded-Proto,
        # X-Request-Id and Connection in one go.
    }

    # Reports (§22). Excel and PDF exports are rendered into a Buffer in full
    # before a single byte is sent (reports.controller.js:53-65), so there is no
    # trickle of output to keep proxy_read_timeout alive — the whole generation
    # has to complete inside one silent window. 180s is a judgement: no report
    # has been timed, and nothing in the code bounds how long a build takes.
    #
    # TWO OTHER SURFACES USE THE SAME RENDERER AND ARE LEFT ON THE 60s DEFAULT,
    # deliberately and not by oversight:
    #   GET /api/v1/documents/:id?format=pdf   documents.controller.js:43-55
    #   GET /api/v1/exams/.../result-card?format=pdf
    #                                          exams.controller.js:192-204
    # Both buffer a PDF whole exactly as reports does, and all three go through
    # utils/pdf (documents.service.js:68, exams.service.js:115,
    # reports.service.js:78). The difference is the input size: those two render
    # ONE row — a certificate, a result card — where a report renders a query's
    # whole result set. 60s is very likely sufficient for a single record. If
    # either ever 504s, the fix is a location for it here with the same shape as
    # this one, and the number belongs to whoever measured it.
    #
    # Note for anyone reading this looking for the backup path: there is none.
    # mysqldump runs only from `npm run db:backup` and the cron scheduler
    # (jobs/cron.js:77, jobs/handlers/index.js:81). No HTTP route triggers it,
    # so it places no constraint on any timeout in this file.
    # This one KEEPS its trailing slash, unlike the five upload prefixes: every
    # reports route has a path segment after the prefix (reports.routes.js:92-99
    # builds six from a table, plus '/subscriptions' at :120), so there is no
    # bare /api/v1/reports request to match and the tighter form is correct.
    location /api/v1/reports/ {
        proxy_pass http://msms_api;
        proxy_read_timeout 180s;
    }

    # ── What is deliberately NOT here ────────────────────────────────────────
    #
    # 1. NO `location /uploads/`, and no `root`/`alias` pointing at
    #    backend/storage/uploads.
    #
    #    docs/ARCHITECTURE.md used to describe this file as "reverse proxy +
    #    SSL + static uploads". That description was wrong against the code and
    #    has since been corrected in place — ARCHITECTURE.md:219-231 now records
    #    the old wording, why it was wrong, and agrees with what follows.
    #
    #    The application has no static file serving at all — no express.static,
    #    no res.sendFile, no res.download (utils/fileResponse.js:1-10, and four
    #    module headers say the same). A stored file is returned only by
    #    `sendStoredFile`, and only after the owning module has loaded the row
    #    through its own finder, which has already applied requirePermission,
    #    the router's tenant guard and the module's self-scoping. On top of that
    #    `fileResponse` re-checks the `school-<id>` path segment against the
    #    record's tenant (fileResponse.js:142) and sets
    #    `Cache-Control: private, no-store` (:200). There is deliberately no
    #    generic /files/:id route, because the 109-permission catalogue SRS §29
    #    fixes contains no file permission to guard one with.
    #
    #    Serving that directory from nginx would hand any school's payment
    #    screenshots and student documents to anyone who knows a 32-hex
    #    filename, bypassing all of that at once. The random filenames are a
    #    defence in depth, not an authorisation scheme.
    #
    # 2. NO frontend routes. The Next.js app is a separate origin (app.js:257-259,
    #    config/env.js:108-109) and is out of scope for this file. If it is ever
    #    fronted by the same nginx it belongs in its own server block for its own
    #    server_name — not as a `location /` here, which would make the two share
    #    an origin and quietly render the entire CORS allow-list moot.
    #
    # 3. NO `limit_req` / `limit_conn`. SRS §24's rate limiting is implemented in
    #    the application (middlewares/rateLimit.js): 1000 requests / 15 min
    #    general, 20 for auth, 60 for AI (config/env.js:180-186), keyed on the
    #    authenticated user where there is one and on the address otherwise —
    #    a distinction nginx cannot make. A second limiter here would refuse with
    #    a different shape, a different Retry-After, and a different idea of who
    #    the caller is. The 1m server-level body cap above is what this file does
    #    instead, and it is a different control: it bounds the SIZE of what an
    #    unauthenticated caller can make nginx buffer, not the RATE. If the Node
    #    process ever needs shielding from a flood it cannot itself absorb, that
    #    is a measured operational decision and the number belongs to whoever
    #    measures it.
    #
    # 4. NO access restriction on /api/v1/docs. §28's Swagger UI is public by an
    #    explicit, reasoned decision in docs/routes.js, which also states the
    #    remedy for a deployment that disagrees: stop mounting that router.
    #    Adding an allow/deny here would be a second policy in a second place.
    #    If it is wanted anyway, this is the shape — but change the app instead:
    #
    #        # location /api/v1/docs { allow 10.0.0.0/8; deny all; proxy_pass http://msms_api; }
    #
    # 5. Everything else 404s in the API's own envelope. This origin serves the
    #    API and nothing else; a request for /, /wp-login.php or /.env gets a
    #    shape a client can parse and reveals nothing about what is behind.
    #    ROUTE_NOT_FOUND is the app's own code for this (errorHandler.js:210).
    location / {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-Id $rid always;
        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        return 404 '{"success":false,"error":{"code":"ROUTE_NOT_FOUND","message":"Not found.","requestId":"$rid"}}';
    }
}


# ── Optional: refuse unknown Host headers ────────────────────────────────────
#
# Without a default server, nginx answers a request for any unmatched Host with
# the first server block in the config — which may well be this one, meaning the
# API answers to a raw IP address or to a stale DNS name. 444 closes the
# connection without a response.
#
# COMMENTED OUT because `default_server` may be declared only once per
# listen address: if the base nginx.conf or another site already has one,
# uncommenting this makes nginx refuse to start. Check with
# `grep -r default_server /etc/nginx/` first.
#
# Note the interaction with `error_page 400` above: a request nginx cannot parse
# well enough to match a server_name is handled by whichever block IS the
# default server. If that is not this one, the MALFORMED_REQUEST envelope will
# not be what such a caller sees — they get the default server's answer instead.
#
# server {
#     listen 80  default_server;
#     listen 443 ssl default_server;
#     server_name _;
#     ssl_certificate     /etc/letsencrypt/live/api.msms.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/api.msms.example.com/privkey.pem;
#     return 444;
# }


