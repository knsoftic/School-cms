#     never been parsed, and never served a request. Every application-side
#     number and file:line was read out of backend/src; every nginx-side
#     behaviour is from nginx's documentation, not from an observation. Run
#     `nginx -t` on the target host before reloading.
#
#  2. Placeholders. `grep -n PLACEHOLDER` on this file lists them; there are
#     also five occurrences of api.msms.example.com in /etc/letsencrypt paths
#     (the :443 block and the commented default_server block) and one frontend
#     origin in the $cors_allow map. All must be substituted.
#
#  ## Assumptions about the host, which the repository does not record
#
#  3. nginx >= 1.25.1 for `http2 on;` and >= 1.15.3 for `keepalive_timeout` /
#     `keepalive_requests` in the upstream block. Both have a documented
#     downgrade in the comment beside them.
#
#  4. IPv6 is available. `listen [::]:80;` and `listen [::]:443 ssl;` are
#     unconditional; on an IPv4-only host nginx aborts at bind with
#     `socket() [::]:80 failed (97: Address family not supported by protocol)`
#     and does not start. Delete both lines there.
#
#  5. /var/www/certbot and /etc/letsencrypt/live/<domain>/ are conventional
#     Linux locations, not values derived from anything in the repository.
#
#  6. The nginx distribution package's /etc/logrotate.d/nginx exists and globs
#     /var/log/nginx/*.log. That is the ONLY thing rotating the two log files
#     this site writes. See the note in the :443 block.
#
#  7. Port 4000 is not reachable from outside this host. This is an assumption
#     about the host firewall, NOT something the application enforces — see the
#     upstream block: server.js:99 binds every interface.
#
#  ## Limitations of what this file can do
#
#  8. §27 "Monitoring": what this file contributes is status codes and two log
#     files. The four nginx-introduced error codes — MALFORMED_REQUEST,
#     CLIENT_TIMEOUT, UPSTREAM_UNAVAILABLE, UPSTREAM_TIMEOUT — exist so a probe
#     can tell "the app is not running" from "the app did not answer inside the
#     configured window". They are NOT application codes; do not publish them
#     in the §28 API documentation.
#
#  9. The $cors_allow map duplicates CORS_ORIGINS. Two places now hold the
#     frontend origin, and nothing enforces that they agree. The failure mode of
#     drift is narrow — nginx's own 400/408/413/502/504/404 become unreadable to
#     the browser again, which is where this file started — but it is silent.
#     Re-check it whenever CORS_ORIGINS changes.
#
# 10. `rid` joins an nginx access line to the app's ERROR and WARN lines
#     (errorHandler.js:227, :235) and to the id in a failure envelope
#     (errorHandler.js:270). It does NOT join to the app's per-request access
#     line, because morgan's format at app.js:216 carries no id and winston's
#     defaultMeta at logger.js:54 carries none. Adding `:res[x-request-id]` to
#     app.js:216 would close that gap; it is an app change and is not made here.
#
# 11. A 413 for an oversized body is best-effort at the HTTP level. nginx
#     refuses as soon as Content-Length exceeds the limit, while the client may
#     still be sending — some clients report the connection reset and never read
#     the JSON envelope. The envelope is correct when it is read; it is not
#     guaranteed to be read.
#
# 12. The five upload prefixes are enumerated by hand from
#     `grep -rn 'uploadSingle(\|uploadArray(' backend/src` outside middlewares/.
#     Nothing keeps them in step with the routes automatically, and they cut
#     both ways: a new upload route under an unlisted prefix gets the 1m server
#     default and a 413, while a new module whose mount name merely EXTENDS one
#     of the five (they are written without a trailing slash, because two of the
#     uploads sit on the module's bare path) silently inherits 12m. Both are
#     checked the same way — against `api.use('/` in app.js.
#
# 13. This file cannot fix three things it depends on, all of them app changes:
#     the bind address (server.js:99), the missing Anthropic client timeout
#     (ai/anthropic.js:63), and the SameSite=Lax cookies that constrain which
#     hostname may be substituted above (auth.controller.js:66, csrf.js:58).
